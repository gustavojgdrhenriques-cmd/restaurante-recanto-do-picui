name: Publicar site no GitHub Pages

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v6
      - name: Configurar Pages
        uses: actions/configure-pages@v5
      - name: Enviar os arquivos do site
        uses: actions/upload-pages-artifact@v4
        with:
          path: restaurante-recanto-do-picui
      - name: Publicar no Pages
        id: deployment
        uses: actions/deploy-pages@v4
